name: Python quality and synthetic security gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q security_lab tests scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic security fixtures
        run: python -m security_lab.cli run --output artifacts/results.json --fail-on-compromise
      - name: Validate synthetic evidence strictly
        run: python scripts/verify_synthetic_evidence.py artifacts/results.json

  devsecops-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned security/build tools
        run: python -m pip install 'ruff==0.17.4' 'bandit==1.9.4' 'pip-audit==2.10.1' 'build==1.6.1'
      - name: Ruff correctness lint
        run: ruff check security_lab scripts tests
      - name: Bandit Python SAST (medium and high findings block)
        run: bandit -r security_lab scripts -ll
      - name: Dependency vulnerability audit (project metadata)
        run: pip-audit .
      - name: Build wheel and sdist
        run: python -m build --sdist --wheel --outdir dist
      - name: Verify release archive contents
        run: python scripts/verify_distribution.py dist
      - name: Create exact-commit source release evidence
        run: python -m scripts.release_bundle create --repo . --archive artifacts/source-release.zip --manifest artifacts/source-release-manifest.json
      - name: Verify source release evidence
        run: python -m scripts.release_bundle verify --archive artifacts/source-release.zip --manifest artifacts/source-release-manifest.json
      - name: Smoke-test installed wheel outside repository
        run: |
          python -m venv /tmp/ai-security-labs-wheel-venv
          /tmp/ai-security-labs-wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/ai-security-labs-wheel-venv/bin/python -c 'import security_lab, scripts.verify_repro_bundle, security_lab.agent_eval; print("wheel-import-ok")'
